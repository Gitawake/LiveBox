name: Build IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build IPA for SideStore
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show build environment
        run: |
          xcodebuild -version
          python3 --version

      - name: Test nested signing
        run: python3 Tests/test_build_ipa_signing.py

      - name: Build Release IPA
        run: python3 tools/build-ipa . --scheme LiveBox --output build/ipa/LiveBox.ipa

      - name: Verify IPA
        run: |
          python3 - <<'PY'
          import plistlib
          import zipfile
          with zipfile.ZipFile('build/ipa/LiveBox.ipa') as archive:
              assert archive.testzip() is None, 'Corrupt IPA'
              info = plistlib.loads(archive.read('Payload/LiveBox.app/Info.plist'))
              assert info['CFBundleSupportedPlatforms'] == ['iPhoneOS']
              print('Version:', info['CFBundleShortVersionString'], 'Build:', info['CFBundleVersion'])
          PY
          verification_dir="$(mktemp -d)"
          trap 'rm -rf "$verification_dir"' EXIT
          ditto -x -k build/ipa/LiveBox.ipa "$verification_dir"
          codesign --verify --deep --strict --verbose=2 "$verification_dir/Payload/LiveBox.app"
          codesign -dvv "$verification_dir/Payload/LiveBox.app"

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: LiveBox-sideload-ipa-${{ github.run_number }}
          path: build/ipa/LiveBox.ipa
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish tagged IPA to Releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd build/ipa
          shasum -a 256 LiveBox.ipa > LiveBox.ipa.sha256
          cat > release-notes.md <<'NOTES'
          将视频转换为 Live Photo，支持可选静态封面及快捷指令。

          下载 LiveBox.ipa 后使用 SideStore 等侧载工具重签安装。
          包含 Ad Hoc 临时签名，无需自行准备开发者证书；此签名不能用于直接安装或 App Store 分发。
          最低 iOS 18.0。LiveBox.ipa.sha256 可用于校验下载文件。
          NOTES
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" LiveBox.ipa LiveBox.ipa.sha256 --clobber
          else
            gh release create "$RELEASE_TAG" LiveBox.ipa LiveBox.ipa.sha256 --verify-tag --title "LiveBox $RELEASE_TAG" --notes-file release-notes.md
          fi
